# ARCC 主配置文件

[model]
# DeepSeek-V4 模型配置
provider = "deepseek"
api_base = "https://api.deepseek.com"
# API Key 可以通过以下两种方式之一设置（优先级：api_key > 环境变量）：
#   1. 直接在此处填写（推荐，~/.arcc/ 已在 .gitignore 中）
#   2. 设置环境变量 DEEPSEEK_API_KEY
api_key = "sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
# api_key_env = "DEEPSEEK_API_KEY"

# 双模型调度
pro_model = "deepseek-v4-pro"       # 复杂推理 + Agent，1M 上下文，支持 tool calling
flash_model = "deepseek-flash"      # 高频对话 + 工具调用，1M 上下文，经济高效

# strict 模式：强制模型工具调用遵循 JSON Schema
# 启用后将使用 Beta endpoint (https://api.deepseek.com/beta)
# 可有效减少 DSML 文本泄漏，推荐与 DSML 恢复层配合使用
use_strict_mode = false

# 上下文管理
context_max_tokens = 800000          # 1M × 80%，达到此阈值触发摘要压缩
temperature = 0.7
max_output_tokens = 4096

[server]
host = "127.0.0.1"
port = 9527
# API Key 鉴权。设置后 /chat 和 /memory 接口需要
# Authorization: Bearer <key> 请求头。留空则不鉴权。
# api_key = "e3f8a2b1-c4d5-4e6f-a8b9-c0d1e2f3a4b5"
metrics_path = "/metrics"
health_path = "/health"

[feishu]
enabled = false
app_id = ""
app_secret = ""
verification_token = ""
webhook_path = "/feishu/webhook"

[safety]
# 危险命令：执行这些命令时需要用户确认
# 不在列表中的命令可以直接执行，无需用户确认
require_human_confirm = ["rm", "mv", "dd", "mkfs", "shutdown", "reboot", "fdisk"]

[execution]
# 命令执行超时时间（秒），超时后自动 kill
command_timeout_seconds = 30
# 命令输出最大字节数，超出的部分被截断
max_output_bytes = 4096

[computer_use]
# 桌面控制（截图 + 鼠标/键盘），目前仅支持 macOS TUI。
# 默认关闭；在 TUI 中用 /computer on 临时开启（每次启动仍需重新开启）。
enabled = false
# 每个鼠标/键盘动作是否需要在 TUI 中确认（y/a/n）。
require_confirmation = true
# 确认超时（秒），超时视为拒绝。
confirmation_timeout_seconds = 120
# 一次用户请求内最多允许的"截图→动作"轮数。
max_rounds = 20
# 截图发送给模型前缩放到该宽度（保持宽高比）。
max_screenshot_width = 1280
# 请求上下文中保留的历史截图数量（旧图只保留文字标签）。
keep_screenshots = 1
# 动作执行后是否自动截屏验证。
capture_after_action = true
# 动作后等待多少毫秒再截图，避免截到旧画面。
action_settle_ms = 250
# 处理图片请求的视觉模型；留空使用 flash_model。
vision_model = ""
# 是否把截图保存到 ~/.arcc/screenshots/ 便于调试。
save_screenshots = false

[storage]
# SQLite 数据库路径（相对于 ~/.arcc/）
db_path = "arcc.db"
# 配置热重载检查间隔（秒）
config_watch_interval = 5

[logging]
level = "info"
# arcc 自身日志级别
arcc_level = "debug"
# 日志输出目录（相对于 ~/.arcc/）
log_dir = "logs"
